<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="60%">
      <stop offset="0%" style="stop-color:#1a0030"/>
      <stop offset="100%" style="stop-color:#0a0a15"/>
    </radialGradient>
    <linearGradient id="star" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff69b4"/>
      <stop offset="50%" style="stop-color:#ff1493"/>
      <stop offset="100%" style="stop-color:#ff00ff"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="200" height="200" fill="url(#bg)"/>
  <circle cx="100" cy="60" r="26" fill="url(#star)" filter="url(#glow)" opacity="0.9"/>
  <ellipse cx="100" cy="125" rx="46" ry="34" fill="url(#star)" opacity="0.5"/>
  <text x="100" y="190" text-anchor="middle" fill="#ff69b4" font-size="10" font-family="Arial" filter="url(#glow)">HERMES WIKI</text>
</svg>